<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aventuras da Julia 🌍</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="stylesheet" href="julia_world/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif; color: #fff;
      background:
        radial-gradient(1200px 800px at 70% -5%, rgba(124, 86, 230, .5), transparent 60%),
        radial-gradient(1000px 700px at 10% 105%, rgba(72, 40, 155, .45), transparent 55%),
        linear-gradient(160deg, #32215c 0%, #221644 52%, #150d2e 100%);
    }
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #stars span {
      position: absolute; border-radius: 50%; background: #fff;
      box-shadow: 0 0 7px rgba(255,255,255,.8); opacity: .7;
    }
    .card {
      position: relative; z-index: 1;
      width: min(460px, 94vw); padding: 36px 34px 26px; text-align: center;
      border: 1px solid rgba(255,255,255,.16); border-radius: 34px;
      background: rgba(43, 30, 84, .68); backdrop-filter: blur(10px);
      box-shadow: 0 24px 70px rgba(0,0,0,.42);
    }
    .wave {
      display: inline-block; font-size: 48px; line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
      animation: wave 1.9s ease-in-out infinite; transform-origin: 72% 78%;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(16deg); }
      45% { transform: rotate(-8deg); }
      70% { transform: rotate(12deg); }
    }
    h1 {
      margin: 12px 0 10px;
      font-family: 'Luckiest Guy', 'Fredoka', sans-serif; font-weight: 400;
      font-size: clamp(36px, 7vw, 46px); letter-spacing: .02em; color: #ffd166;
      text-shadow: 0 3px 0 rgba(120, 60, 0, .35), 0 8px 22px rgba(0,0,0,.35);
    }
    .tagline { margin: 0 auto; max-width: 340px; color: #e9e2ff; font-size: 15.5px; font-weight: 500; line-height: 1.5; }
    .name-label { display: block; margin: 16px auto 6px; color: #c9bff2; font-size: 13px; font-weight: 700; }
    .name-input {
      display: block; width: min(300px, 100%); margin: 0 auto; padding: 12px 16px;
      border: 2px solid rgba(255,255,255,.25); border-radius: 999px;
      color: #fff; background: rgba(255,255,255,.1);
      font: 600 15px 'Fredoka', 'Segoe UI', sans-serif; text-align: center; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .name-input:focus { border-color: #ffd166; box-shadow: 0 0 0 3px rgba(255,209,102,.25); }
    .name-input::placeholder { color: rgba(255,255,255,.45); }
    .apps { display: flex; flex-direction: column; gap: 13px; margin-top: 22px; }
    .app {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 15px 22px; border: 0; border-radius: 999px;
      font: 700 17px 'Fredoka', 'Segoe UI', sans-serif; color: #fff;
      text-decoration: none; text-align: left;
      transition: transform .15s, filter .2s, background .2s;
    }
    .app .emoji { font-size: 23px; }
    .app-live {
      background: linear-gradient(135deg, #ff9a3d, #ff5e7e);
      box-shadow: 0 10px 26px rgba(255, 94, 126, .38);
    }
    .app-live:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .app-soon {
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.68);
      border: 2px dashed rgba(255,255,255,.28); cursor: default;
    }
    .soon-badge {
      margin-left: auto; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.16); color: #fff;
      font-size: 10.5px; font-weight: 700; letter-spacing: .08em; white-space: nowrap;
    }
    .language-label { margin: 18px 0 8px; color: #c9bff2; font-size: 13px; font-weight: 700; }
    .languages { display: flex; justify-content: center; gap: 8px; }
    .lang-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      color: #f8f6ff; background: rgba(255,255,255,.1);
      font: 600 13px 'Fredoka', sans-serif; cursor: pointer;
      transition: transform .15s, background .2s, border-color .2s;
    }
    .lang-pill:hover { transform: translateY(-2px); background: rgba(255,255,255,.18); }
    .lang-pill.selected {
      border-color: var(--gold, #ffd166); background: rgba(255,209,102,.2);
      box-shadow: 0 0 0 2px rgba(255,209,102,.2);
    }
    .lang-pill .flag { font-size: 17px; line-height: 1; }
    .page-buttons { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .page-button {
      padding: 9px 16px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
      color: #e9e2ff; background: rgba(255,255,255,.08);
      font: 700 13px 'Fredoka', sans-serif; cursor: pointer;
      transition: transform .15s, background .2s;
    }
    .page-button:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); }
    .made { margin: 20px 0 0; color: rgba(255,255,255,.55); font-size: 12.5px; font-weight: 500; }
    .backdrop {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(10, 6, 28, .6); backdrop-filter: blur(3px);
      transition: opacity .2s, visibility .2s;
    }
    .backdrop.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .panel {
      width: min(540px, 100%); max-height: min(760px, calc(100vh - 32px)); overflow-y: auto;
      padding: 22px 22px 24px; color: #293354; background: #fffaf0;
      border: 2px solid rgba(255,255,255,.8); border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .panel-head h2 { margin: 0; color: #1f2c66; font-size: 24px; }
    .panel-close {
      width: 34px; height: 34px; border: 0; border-radius: 50%; color: #666;
      background: rgba(0,0,0,.07); font-size: 16px; cursor: pointer;
    }
    .panel-intro { margin: 0 0 16px; color: #65708e; font-size: 13px; line-height: 1.45; }
    .panel-section { padding: 13px 0 2px; border-top: 2px solid #f4e7c6; }
    .panel-section h3 { margin: 0 0 6px; color: #33406b; font-size: 15px; }
    .panel-section p { margin: 0 0 10px; color: #596580; font-size: 13px; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; } .app-live:hover { transform: none; } }
    @media (max-width: 480px) { .card { padding: 30px 20px 22px; } }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <main class="card">
    <span class="wave" aria-hidden="true">👋</span>
    <h1 id="hubTitle">OLÁ, JULIA!</h1>
    <p class="tagline" id="tagline">Escolha uma aventura para começar:</p>
    <label class="name-label" for="nameInput" id="nameLabel">Seu nome</label>
    <input class="name-input" id="nameInput" type="text" maxlength="32" autocomplete="off" placeholder="Escreva seu nome">
    <div class="language-label" id="languageLabel">🌐 Escolha seu idioma</div>
    <div class="languages">
      <button class="lang-pill" data-language="pt" type="button"><span class="flag">🇧🇷</span>PT</button>
      <button class="lang-pill" data-language="en" type="button"><span class="flag">🇺🇸</span>EN</button>
      <button class="lang-pill" data-language="es" type="button"><span class="flag">🇪🇸</span>ES</button>
    </div>
    <nav class="apps" aria-label="Aventuras">
      <a class="app app-live" href="julia_world/index.html" id="appWorld">
        <span class="emoji" aria-hidden="true">🌍</span>
        <span data-i18n="world">Julia's World</span>
        <span class="emoji" style="margin-left:auto" aria-hidden="true">🚀</span>
      </a>
      <button class="app app-soon" type="button" disabled>
        <span class="emoji" aria-hidden="true">🔢</span>
        <span data-i18n="math">Aventuras de Matemática</span>
        <span class="soon-badge" data-i18n="soon">EM BREVE</span>
      </button>
      <button class="app app-soon" type="button" disabled>
        <span class="emoji" aria-hidden="true">💬</span>
        <span data-i18n="english">Aventuras de Inglês</span>
        <span class="soon-badge" data-i18n="soon">EM BREVE</span>
      </button>
    </nav>
    <div class="page-buttons">
      <button class="page-button" id="helpOpen" type="button">❓ <span data-i18n="helpButton">Help</span></button>
      <button class="page-button" id="aboutOpen" type="button">ℹ️ <span data-i18n="aboutButton">About</span></button>
    </div>
    <p class="made" id="madeWith">feito com 💛 pela Julia e pelo papai</p>
  </main>

  <div class="backdrop hidden" id="helpBackdrop">
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <div class="panel-head"><h2 id="helpTitle">❓ Como usar o atlas</h2><button class="panel-close" id="helpClose" aria-label="Fechar ajuda">✕</button></div>
      <p class="panel-intro" id="helpIntro"></p>
      <section class="panel-section"><h3 id="helpExploreTitle"></h3><p id="helpExploreText"></p></section>
      <section class="panel-section"><h3 id="helpControlsTitle"></h3><p id="helpControlsText"></p></section>
      <section class="panel-section"><h3 id="helpStickersTitle"></h3><p id="helpStickersText"></p></section>
      <section class="panel-section"><h3 id="helpBadgesTitle"></h3><p id="helpBadgesText"></p></section>
      <section class="panel-section"><h3 id="helpRankingTitle"></h3><p id="helpRankingText"></p></section>
    </aside>
  </div>

  <div class="backdrop hidden" id="aboutBackdrop">
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <div class="panel-head"><h2 id="aboutTitle">ℹ️ Sobre este projeto</h2><button class="panel-close" id="aboutClose" aria-label="Fechar About">✕</button></div>
      <p class="panel-intro" id="aboutIntro"></p>
      <section class="panel-section"><h3 id="aboutStoryTitle"></h3><p id="aboutStoryText"></p></section>
      <section class="panel-section"><h3 id="aboutCreatorsTitle"></h3><p id="aboutCreatorsText"></p></section>
      <section class="panel-section"><h3 id="aboutAITitle"></h3><p id="aboutAIText"></p></section>
    </aside>
  </div>

  <script>
    const STORAGE_KEY = 'mundo-da-julia.preferences.v1';
    const LANG_META = {
      pt: { locale: 'pt-BR', flag: '🇧🇷' },
      en: { locale: 'en-US', flag: '🇺🇸' },
      es: { locale: 'es-ES', flag: '🇪🇸' },
    };
    const COPY = {
      pt: {
        htmlLang: 'pt-BR', title: 'Aventuras da Julia 🌍', hello: 'OLÁ, JULIA!',
        tagline: 'Escolha uma aventura para começar:', nameLabel: 'Seu nome', namePlaceholder: 'Escreva seu nome', world: "Julia's World",
        math: 'Aventuras de Matemática', english: 'Aventuras de Inglês', soon: 'EM BREVE',
        languageLabel: '🌐 Escolha seu idioma', helpButton: 'Help', aboutButton: 'About',
        madeWith: 'feito com 💛 pela Julia e pelo papai',
        helpTitle: '❓ Como usar o atlas', helpClose: 'Fechar ajuda', helpIntro: 'Descubra como explorar o mundo, colecionar stickers e conquistar badges.', helpExploreTitle: '🌍 Explorar o mundo', helpExploreText: 'Arraste o globo para girar, use a roda do mouse para chegar mais perto e clique em um país para abrir sua ficha.', helpControlsTitle: '🖱️ Controles rápidos', helpControlsText: 'Use Início para voltar à visão inicial, Menu para voltar aqui, Girar para deixar o planeta rodando e o menu ☰ dentro do app para mais configurações.', helpStickersTitle: '🎟️ Stickers', helpStickersText: 'Cada lugar aberto dá 1 sticker com link para a Wikipedia. Ao visitar 10 lugares, você ganha +5 stickers; ao chegar a 50, ganha +20 adicionais, além do bônus anterior.', helpBadgesTitle: '🏅 Badges', helpBadgesText: 'Complete todos os países de um continente para ganhar seu badge. Também existem badges por 5, 25 e 75 lugares, além do Super explorador ao visitar todos os países.', helpRankingTitle: '🏆 Ranking', helpRankingText: 'Você ganha 3 pontos por lugar e 100 pontos por badge. Trocar explorador permite registrar várias pessoas; os perfis ficam salvos neste computador.',
        aboutTitle: 'ℹ️ Sobre este projeto', aboutClose: 'Fechar About', aboutIntro: 'Julia’s World é um projeto feito pela Julia com o pai, Marcelo.', aboutStoryTitle: '💛 Uma ideia para fazer juntos', aboutStoryText: 'Nós dois queríamos uma atividade para fazer juntos. Por isso, escolhemos criar apps com inteligência artificial e transformar essa ideia em um mundo para explorar.', aboutCreatorsTitle: '👩‍💻👨‍💻 Julia e Marcelo', aboutCreatorsText: 'Este app é resultado do trabalho conjunto dos dois.', aboutAITitle: '✨ Criando com IA', aboutAIText: 'A inteligência artificial foi usada como uma ferramenta de criação para ajudar a transformar as ideias deles em apps.',
      },
      en: {
        htmlLang: 'en', title: "Julia's Adventures 🌍", hello: 'HELLO, JULIA!',
        tagline: 'Pick an adventure to start:', nameLabel: 'Your name', namePlaceholder: 'Type your name', world: "Julia's World",
        math: 'Math Adventures', english: 'English Adventures', soon: 'COMING SOON',
        languageLabel: '🌐 Choose your language', helpButton: 'Help', aboutButton: 'About',
        madeWith: 'made with 💛 by Julia and her dad',
        helpTitle: '❓ How to use the atlas', helpClose: 'Close help', helpIntro: 'Learn how to explore the world, collect stickers and earn badges.', helpExploreTitle: '🌍 Explore the world', helpExploreText: 'Drag the globe to spin it, use the mouse wheel to zoom and click a country to open its card.', helpControlsTitle: '🖱️ Quick controls', helpControlsText: 'Use Home to return to the starting view, Menu to come back here, Spin to keep the planet moving and the ☰ menu inside the app for more settings.', helpStickersTitle: '🎟️ Stickers', helpStickersText: 'Each place you open gives you 1 sticker with a Wikipedia link. At 10 places you get +5 stickers; at 50 you get +20 more, in addition to the earlier bonus.', helpBadgesTitle: '🏅 Badges', helpBadgesText: 'Complete every country in a continent to earn its badge. There are also badges for 5, 25 and 75 places, plus Super Explorer for visiting every country.', helpRankingTitle: '🏆 Leaderboard', helpRankingText: 'You get 3 points per place and 100 points per badge. Switch explorer to record several people; profiles are saved on this computer.',
        aboutTitle: 'ℹ️ About this project', aboutClose: 'Close About', aboutIntro: "Julia’s World is a project made by Julia and her father, Marcelo.", aboutStoryTitle: '💛 An activity to do together', aboutStoryText: 'They wanted an activity they could do together, so they chose to create apps with artificial intelligence and turn that idea into a world to explore.', aboutCreatorsTitle: '👩‍💻👨‍💻 Julia and Marcelo', aboutCreatorsText: 'This app is the result of their work together.', aboutAITitle: '✨ Creating with AI', aboutAIText: 'Artificial intelligence was used as a creative tool to help turn their ideas into apps.',
      },
      es: {
        htmlLang: 'es', title: 'Aventuras de Julia 🌍', hello: '¡HOLA, JULIA!',
        tagline: 'Elige una aventura para empezar:', nameLabel: 'Tu nombre', namePlaceholder: 'Escribe tu nombre', world: "Julia's World",
        math: 'Aventuras de Matemáticas', english: 'Aventuras de Inglés', soon: 'PRONTO',
        languageLabel: '🌐 Elige tu idioma', helpButton: 'Ayuda', aboutButton: 'Acerca de',
        madeWith: 'hecho con 💛 por Julia y su papá',
        helpTitle: '❓ Cómo usar el atlas', helpClose: 'Cerrar ayuda', helpIntro: 'Descubre cómo explorar el mundo, coleccionar stickers y ganar badges.', helpExploreTitle: '🌍 Explorar el mundo', helpExploreText: 'Arrastra el globo para girarlo, usa la rueda del mouse para acercarte y haz clic en un país para abrir su ficha.', helpControlsTitle: '🖱️ Controles rápidos', helpControlsText: 'Usa Inicio para volver a la vista inicial, Menú para volver aquí, Girar para mantener el planeta en movimiento y el menú ☰ dentro del app para más configuraciones.', helpStickersTitle: '🎟️ Stickers', helpStickersText: 'Cada lugar que abras te da 1 sticker con enlace a Wikipedia. Al visitar 10 lugares ganas +5 stickers; al llegar a 50 ganas +20 adicionales, además del bono anterior.', helpBadgesTitle: '🏅 Badges', helpBadgesText: 'Completa todos los países de un continente para ganar su badge. También hay badges por 5, 25 y 75 lugares, además del Super explorador al visitar todos los países.', helpRankingTitle: '🏆 Ranking', helpRankingText: 'Ganas 3 puntos por lugar y 100 puntos por badge. Cambiar de explorador permite registrar varias personas; los perfiles se guardan en esta computadora.',
        aboutTitle: 'ℹ️ Sobre este proyecto', aboutClose: 'Cerrar Acerca de', aboutIntro: 'Julia’s World es un proyecto hecho por Julia y su padre, Marcelo.', aboutStoryTitle: '💛 Una actividad para hacer juntos', aboutStoryText: 'Querían una actividad para hacer juntos, así que eligieron crear apps con inteligencia artificial y convertir esa idea en un mundo para explorar.', aboutCreatorsTitle: '👩‍💻👨‍💻 Julia y Marcelo', aboutCreatorsText: 'Este app es el resultado del trabajo conjunto de los dos.', aboutAITitle: '✨ Creando con IA', aboutAIText: 'La inteligencia artificial se usó como una herramienta creativa para ayudar a convertir sus ideas en apps.',
      },
    };

    const $ = (id) => document.getElementById(id);

    function loadPrefs() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {};
        return raw && typeof raw === 'object' ? raw : {};
      } catch { return {}; }
    }
    function savePrefs(changes) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...loadPrefs(), ...changes })); } catch {}
    }

    let language = ['pt', 'en', 'es'].includes(loadPrefs().language) ? loadPrefs().language : 'pt';
    const nameInput = $('nameInput');
    nameInput.value = String(loadPrefs().name || '').trim().replace(/\s+/g, ' ');

    function applyLanguage() {
      const copy = COPY[language];
      document.documentElement.lang = copy.htmlLang;
      document.title = copy.title;
      $('hubTitle').textContent = copy.hello;
      $('tagline').textContent = copy.tagline;
      $('nameLabel').textContent = copy.nameLabel;
      nameInput.placeholder = copy.namePlaceholder;
      $('languageLabel').textContent = copy.languageLabel;
      $('madeWith').textContent = copy.madeWith;
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = copy[el.dataset.i18n] ?? el.textContent;
      for (const button of document.querySelectorAll('[data-language]')) {
        const selected = button.dataset.language === language;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      }
      const helpIds = ['helpTitle', 'helpIntro', 'helpExploreTitle', 'helpExploreText', 'helpControlsTitle', 'helpControlsText', 'helpStickersTitle', 'helpStickersText', 'helpBadgesTitle', 'helpBadgesText', 'helpRankingTitle', 'helpRankingText'];
      for (const id of helpIds) $(id).textContent = copy[id];
      $('helpClose').setAttribute('aria-label', copy.helpClose);
      const aboutIds = ['aboutTitle', 'aboutIntro', 'aboutStoryTitle', 'aboutStoryText', 'aboutCreatorsTitle', 'aboutCreatorsText', 'aboutAITitle', 'aboutAIText'];
      for (const id of aboutIds) $(id).textContent = copy[id];
      $('aboutClose').setAttribute('aria-label', copy.aboutClose);
    }

    for (const button of document.querySelectorAll('[data-language]')) {
      button.addEventListener('click', () => {
        language = button.dataset.language;
        savePrefs({ language });
        applyLanguage();
      });
    }
    nameInput.addEventListener('input', () => savePrefs({ name: nameInput.value.trim().replace(/\s+/g, ' ') }));

    function bindModal(openId, backdropId, closeId) {
      const backdrop = $(backdropId);
      $(openId).addEventListener('click', () => { backdrop.classList.remove('hidden'); $(closeId).focus(); });
      $(closeId).addEventListener('click', () => backdrop.classList.add('hidden'));
      backdrop.addEventListener('click', (event) => { if (event.target === backdrop) backdrop.classList.add('hidden'); });
    }
    bindModal('helpOpen', 'helpBackdrop', 'helpClose');
    bindModal('aboutOpen', 'aboutBackdrop', 'aboutClose');
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { $('helpBackdrop').classList.add('hidden'); $('aboutBackdrop').classList.add('hidden'); }
    });

    const layer = $('stars');
    const fragment = document.createDocumentFragment();
    for (let index = 0; index < 110; index += 1) {
      const star = document.createElement('span');
      const size = Math.random() * 2.4 + .7;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.opacity = `${Math.random() * .65 + .25}`;
      fragment.appendChild(star);
    }
    layer.appendChild(fragment);

    applyLanguage();
  </script>
</body>
</html>
