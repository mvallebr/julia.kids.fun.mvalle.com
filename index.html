<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aventuras da Julia 🌍</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="stylesheet" href="julia_world/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif; color: #fff;
      background:
        radial-gradient(1200px 800px at 70% -5%, rgba(124, 86, 230, .5), transparent 60%),
        radial-gradient(1000px 700px at 10% 105%, rgba(72, 40, 155, .45), transparent 55%),
        linear-gradient(160deg, #32215c 0%, #221644 52%, #150d2e 100%);
    }
    #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #stars span {
      position: absolute; border-radius: 50%; background: #fff;
      box-shadow: 0 0 7px rgba(255,255,255,.8); opacity: .7;
    }
    .card {
      position: relative; z-index: 1;
      width: min(460px, 94vw); padding: 40px 34px 30px; text-align: center;
      border: 1px solid rgba(255,255,255,.16); border-radius: 34px;
      background: rgba(43, 30, 84, .68); backdrop-filter: blur(10px);
      box-shadow: 0 24px 70px rgba(0,0,0,.42);
    }
    .wave {
      display: inline-block; font-size: 48px; line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
      animation: wave 1.9s ease-in-out infinite; transform-origin: 72% 78%;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(16deg); }
      45% { transform: rotate(-8deg); }
      70% { transform: rotate(12deg); }
    }
    h1 {
      margin: 12px 0 10px;
      font-family: 'Luckiest Guy', 'Fredoka', sans-serif; font-weight: 400;
      font-size: clamp(36px, 7vw, 46px); letter-spacing: .02em; color: #ffd166;
      text-shadow: 0 3px 0 rgba(120, 60, 0, .35), 0 8px 22px rgba(0,0,0,.35);
    }
    .tagline { margin: 0 auto; max-width: 340px; color: #e9e2ff; font-size: 15.5px; font-weight: 500; line-height: 1.5; }
    .apps { display: flex; flex-direction: column; gap: 13px; margin-top: 28px; }
    .app {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 15px 22px; border: 0; border-radius: 999px;
      font: 700 17px 'Fredoka', 'Segoe UI', sans-serif; color: #fff;
      text-decoration: none; text-align: left;
      transition: transform .15s, filter .2s, background .2s;
    }
    .app .emoji { font-size: 23px; }
    .app .arrow { margin-left: auto; font-size: 18px; opacity: .95; }
    .app-live {
      background: linear-gradient(135deg, #ff9a3d, #ff5e7e);
      box-shadow: 0 10px 26px rgba(255, 94, 126, .38);
    }
    .app-live:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .app-soon {
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.68);
      border: 2px dashed rgba(255,255,255,.28); cursor: default;
    }
    .soon-badge {
      margin-left: auto; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.16); color: #fff;
      font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    }
    .made { margin: 24px 0 0; color: rgba(255,255,255,.55); font-size: 12.5px; font-weight: 500; }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; } .app-live:hover { transform: none; } }
    @media (max-width: 480px) { .card { padding: 32px 20px 24px; } }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <main class="card">
    <span class="wave" aria-hidden="true">👋</span>
    <h1>OLÁ, JULIA!</h1>
    <p class="tagline">Escolha uma aventura para começar:</p>
    <nav class="apps" aria-label="Aventuras">
      <a class="app app-live" href="julia_world/">
        <span class="emoji" aria-hidden="true">🌍</span>
        <span>Julia's World</span>
        <span class="arrow" aria-hidden="true">🚀</span>
      </a>
      <button class="app app-soon" type="button" disabled>
        <span class="emoji" aria-hidden="true">🔢</span>
        <span>Aventuras de Matemática</span>
        <span class="soon-badge">EM BREVE</span>
      </button>
      <button class="app app-soon" type="button" disabled>
        <span class="emoji" aria-hidden="true">💬</span>
        <span>Aventuras de Inglês</span>
        <span class="soon-badge">EM BREVE</span>
      </button>
    </nav>
    <p class="made">feito com 💛 pela Julia e pelo papai</p>
  </main>
  <script>
    const layer = document.getElementById('stars');
    const fragment = document.createDocumentFragment();
    for (let index = 0; index < 110; index += 1) {
      const star = document.createElement('span');
      const size = Math.random() * 2.4 + .7;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.opacity = `${Math.random() * .65 + .25}`;
      fragment.appendChild(star);
    }
    layer.appendChild(fragment);
  </script>
</body>
</html>
