<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const file = new URLSearchParams(location.search).get('f') || 'crumb-rigged.glb';
new GLTFLoader().load('./assets/' + file, (gltf) => {
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const idle = gltf.animations.find((a) => /idle/i.test(a.name));
  if (idle) mixer.clipAction(idle).play();
  mixer.update(0.5); // meio segundo de idle
  gltf.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  window.__RESULT = {
    min: box.min.toArray().map((n) => +n.toFixed(2)),
    max: box.max.toArray().map((n) => +n.toFixed(2)),
    played: idle ? idle.name : 'nenhuma',
  };
  window.__DONE = true;
}, undefined, (e) => { window.__RESULT = { error: String(e) }; window.__DONE = true; });
</script></body></html>
