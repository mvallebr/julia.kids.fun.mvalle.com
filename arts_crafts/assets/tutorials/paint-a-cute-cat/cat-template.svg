<?xml version="1.0" encoding="UTF-8"?>
<!--
  Molde de impressão do Gato Pintado, em A4.

  É a MESMA figura dos sete passos da lição, e não um gato parecido: o que a
  criança imprime é exatamente o que aparece na tela e o que ela vai pintar.
  Os sete quadros são este mesmo desenho com as áreas sendo pintadas em ordem.

  Aqui as caixas de região fizeram um trabalho a mais: as listras dividem o
  rabo e as orelhas em dezenas de lasquinhas, e uma única caixa pega todas,
  para pintarem de uma cor só. Sem isso o rabo ficaria branco e o gato
  pareceria inacabado.

  A figura nasce como figura para colorir, em contorno de lápis sobre papel
  branco. A imagem foi recortada pela tinta e encaixada na folha com folga.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 595 842" width="210mm" height="297mm" role="img"
     aria-label="Molde do gato para imprimir e pintar">
  <title>Molde do gato</title>
  <desc>Gato desenhado a lápis, com o contorno de fora e de dentro, pronto para pintar em folha A4. Sem texto.</desc>
  <rect x="0" y="0" width="595" height="842" fill="#ffffff"/>
  <image x="45" y="204" width="505" height="433" preserveAspectRatio="xMidYMid meet"
         xlink:href="outline.png"/>
</svg>
