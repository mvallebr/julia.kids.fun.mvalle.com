<?xml version="1.0" encoding="UTF-8"?>
<!--
  Molde de impressão do Balão Colorido, em A4.

  É a MESMA figura dos sete passos da lição, e não um balão parecido: o que a
  criança imprime é exatamente o que aparece na tela e o que ela vai pintar.
  Os sete quadros são este mesmo desenho com as áreas sendo pintadas em ordem,
  e cada área é a região que o próprio lápis fechou — por isso a tinta não
  vaza do formato, mesmo com as listras dividindo o desenho em pedaços.

  A figura nasce como figura para colorir, em contorno de lápis sobre papel
  branco, com o painel de fora traçado para que a tinta não escape. A imagem
  foi recortada pela tinta e encaixada na folha com folga para as mãos.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 595 842" width="210mm" height="297mm" role="img"
     aria-label="Molde do balão de ar quente para imprimir e pintar">
  <title>Molde do balão de ar quente</title>
  <desc>Balão desenhado a lápis, com o contorno de fora e de dentro, pronto para pintar em folha A4. Sem texto.</desc>
  <rect x="0" y="0" width="595" height="842" fill="#ffffff"/>
  <image x="45" y="104" width="505" height="633" preserveAspectRatio="xMidYMid meet"
         xlink:href="outline.png"/>
</svg>
