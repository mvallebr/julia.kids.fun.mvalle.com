<?xml version="1.0" encoding="UTF-8"?>
<!--
  Molde de impressão da Corujinha Pintada, em A4.

  Este molde é o desenho a lápis da corujinha, e não uma silhueta: traz o
  contorno de fora E o de dentro — fileiras de penas, cada pena uma forma
  fechada, as barbas das asas, o tufo das orelhas, o bico e as patas com os
  dedos. Sem contorno interno o passo 1 não teria o que ensinar e a folha não
  teria o que colorir.

  É a MESMA figura dos sete passos da lição, e não uma coruja parecida: o que a
  criança imprime é exatamente o que aparece na tela e o que ela vai pintar. Os
  sete quadros são este mesmo desenho com as áreas sendo pintadas em ordem, e
  cada área é a região que o próprio lápis fechou.

  A figura é gerada, não desenhada à mão aqui: 1152x864, recortada e centrada
  numa folha A4 com margem para as mãos e a mesa.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 595 842" width="210mm" height="297mm" role="img"
     aria-label="Molde da corujinha para imprimir e pintar">
  <title>Molde da corujinha</title>
  <desc>Corujinha desenhada a lápis, com o contorno interno todo, pronta para pintar em folha A4. Sem texto.</desc>
  <rect x="0" y="0" width="595" height="842" fill="#ffffff"/>
  <image x="30" y="221" width="535" height="401" preserveAspectRatio="xMidYMid meet"
         xlink:href="owl-outline.png"/>
</svg>
