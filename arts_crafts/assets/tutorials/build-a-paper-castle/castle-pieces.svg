<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="210mm" height="297mm" role="img" aria-label="Paper castle pieces template">
  <title>Paper castle pieces template</title>
  <desc>Black line art of the pieces to cut out for a paper castle: two towers with fold tabs, two walls with battlements and fold tabs, an arched gate with a fold tab, a base with two guide marks, and two small flags with their strips. Dashed grey lines are fold lines and come on top of the pieces. No text.</desc>
  <rect x="0" y="0" width="595" height="842" fill="#ffffff"/>

  <g fill="#ffffff" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- torre alta esquerda, com telhado conico -->
    <path d="M100 70 L172 70 L172 280 L100 280 Z"/>
    <path d="M100 96 L136 42 L172 96 Z"/>
    <!-- torre alta direita, com telhado conico -->
    <path d="M440 70 L512 70 L512 280 L440 280 Z"/>
    <path d="M440 96 L476 42 L512 96 Z"/>
    <!-- janelas das torres -->
    <path d="M124 150 q12 -22 24 0 v40 h-24 Z"/>
    <path d="M464 150 q12 -22 24 0 v40 h-24 Z"/>

    <!-- muro esquerdo, com ameias -->
    <path d="M100 350 v-34 h18 v34 h9 v-34 h18 v34 h9 v-34 h18 v34 v160 h-72 Z"/>
    <!-- portao em miniatura no muro esquerdo -->
    <path d="M124 410 q14 -30 28 0 v70 h-28 Z"/>
    <!-- muro direito, com ameias -->
    <path d="M440 350 v-34 h18 v34 h9 v-34 h18 v34 h9 v-34 h18 v34 v160 h-72 Z"/>
    <!-- portao em miniatura no muro direito -->
    <path d="M464 410 q14 -30 28 0 v70 h-28 Z"/>

    <!-- portao, com aba para colar na base -->
    <path d="M250 560 h95 v-70 q0 -48 -47 -48 q-48 0 -48 48 Z"/>

    <!-- base do castelo -->
    <path d="M180 620 h235 v56 h-235 Z"/>

    <!-- bandeirinhas: triangulo de papel com o palito fino -->
    <path d="M120 742 L145 706 L170 742 Z"/>
    <rect x="136" y="742" width="12" height="58"/>
    <path d="M260 742 L285 706 L310 742 Z"/>
    <rect x="276" y="742" width="12" height="58"/>
  </g>

  <!-- dobras: tracejadas, por cima das pecas -->
  <g fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="8 7">
    <!-- abas de dobra dos muros e das torres -->
    <rect x="60" y="70" width="40" height="210"/>
    <rect x="400" y="70" width="40" height="210"/>
    <rect x="60" y="350" width="40" height="160"/>
    <rect x="400" y="350" width="40" height="160"/>
    <!-- aba do portao -->
    <rect x="210" y="512" width="40" height="48"/>
    <!-- onde as abas dos muros descem sobre a base -->
    <rect x="196" y="620" width="40" height="56"/>
    <rect x="360" y="620" width="40" height="56"/>
    <!-- dobras do triangulo da bandeirinha sobre o palito -->
    <line x1="136" y1="742" x2="148" y2="742"/>
    <line x1="276" y1="742" x2="288" y2="742"/>
  </g>
</svg>
